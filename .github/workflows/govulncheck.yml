name: govulncheck
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yml
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.*'
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest $(go list ./... | grep -v /integrationtest)
